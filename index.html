<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1 class="logo">Your Name</h1>
    <nav class="nav">
      <button id="muteBtn">🔊</button>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="home" class="hero">
    <h2>Hi, I'm <span>Your Name</span></h2>
    <p>I create digital experiences with style.</p>
    <button onclick="document.querySelector('#contact').scrollIntoView({behavior:'smooth'});">Contact Me</button>
  </section>

  <section id="about" class="content-section">
    <h3>About Me</h3>
    <p>Write your bio here. Who are you? What do you love building?</p>
  </section>

  <section id="projects" class="content-section">
    <h3>Projects</h3>
    <div class="projects-grid">
      <div class="project-card">
        <h4>Project Title</h4>
        <p>Short description.</p>
      </div>
      <div class="project-card">
        <h4>Project Title</h4>
        <p>Short description.</p>
      </div>
    </div>
  </section>

  <section id="contact" class="content-section">
    <h3>Contact</h3>
    <form id="contactForm">
      <label>Name<br><input type="text" required></label><br>
      <label>Message<br><textarea rows="4" required></textarea></label><br>
      <button type="submit">Send</button>
    </form>
    <div id="formResult"></div>
  </section>

  <footer class="footer">
    <small>© Your Name — Portfolio</small>
  </footer>

  <script src="script.js"></script>
  <audio id="bgm" src="music.mp3" autoplay loop></audio>
</body>
</html>
